# Push a tag like v0.2.0 to publish a release. The files people install come only from here:
# tested, checksummed, and with a signed build provenance attestation (who built it, from which commit).
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub release
  id-token: write     # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Tests must pass
        run: node --test --test-timeout=120000
      - name: Tag must match the version in phonepeek.js
        run: test "v$(node phonepeek.js --version)" = "$GITHUB_REF_NAME"
      - name: Checksums
        run: sha256sum phonepeek.js install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            phonepeek.js
            install.sh
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" phonepeek.js install.sh SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
