<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"
  aria-label="Your phone connects over Wi-Fi to phonepeek on your computer, which passes requests to your dev server on localhost. Other devices on the Wi-Fi are blocked with 403 Forbidden.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#13213d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>

  <!-- your phone -->
  <rect x="70" y="110" width="120" height="220" rx="24.0" fill="#0f172a" stroke="url(#accent)" stroke-width="6"/><rect x="108.4" y="121.0" width="43.199999999999996" height="7.700000000000001" rx="3.8500000000000005" fill="url(#accent)"/><path fill-rule="evenodd" fill="#f8fafc" d="M92 160h24v24h-24z M97 165v14h14v-14z"/><rect x="101" y="169" width="6" height="6" fill="#f8fafc"/><path fill-rule="evenodd" fill="#f8fafc" d="M124 160h24v24h-24z M129 165v14h14v-14z"/><rect x="133" y="169" width="6" height="6" fill="#f8fafc"/><path fill-rule="evenodd" fill="#f8fafc" d="M92 192h24v24h-24z M97 197v14h14v-14z"/><rect x="101" y="201" width="6" height="6" fill="#f8fafc"/><rect x="124" y="192" width="8" height="8" fill="#f8fafc"/><rect x="140" y="192" width="8" height="8" fill="#f8fafc"/><rect x="132" y="200" width="8" height="8" fill="#f8fafc"/><rect x="124" y="208" width="8" height="8" fill="#f8fafc"/><rect x="140" y="208" width="8" height="8" fill="#f8fafc"/><rect x="92" y="230" width="56" height="8" rx="4" fill="url(#accent)"/>
  <text x="130" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Your phone</text>
  <text x="130" y="394" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">scanned the QR code</text>

  <!-- other device -->
  <rect x="100" y="440" width="60" height="110" rx="12.0" fill="#0f172a" stroke="#475569" stroke-width="4"/><rect x="119.2" y="445.5" width="21.599999999999998" height="3.8500000000000005" rx="1.9250000000000003" fill="#475569"/>
  <text x="130" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Anyone else</text>
  <text x="130" y="603" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">on the Wi-Fi</text>

  <!-- arrows from the left -->
  <line x1="200" y1="220" x2="366" y2="220" stroke="#34d399" stroke-width="4" marker-start="url(#ok)" marker-end="url(#ok)"/>
  <text x="283" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#cbd5e1">Wi-Fi</text>
  <line x1="170" y1="495" x2="338" y2="495" stroke="#f87171" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="352" cy="495" r="17" fill="#450a0a" stroke="#f87171" stroke-width="3"/>
  <path d="M345 488l14 14M359 488l-14 14" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <text x="255" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f87171">403 Forbidden</text>

  <!-- your computer -->
  <rect x="320" y="60" width="840" height="500" rx="26" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="352" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b" letter-spacing="1.5">YOUR COMPUTER</text>

  <!-- phonepeek -->
  <rect x="370" y="130" width="340" height="400" rx="20" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
  <text x="400" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">phone<tspan fill="url(#accent)">peek</tspan></text>
  <text x="400" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">192.168.1.23:3000</text>
  <line x1="400" y1="240" x2="680" y2="240" stroke="#1e293b" stroke-width="2"/>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#e2e8f0">
    <tspan x="400" y="282"><tspan fill="#34d399" font-weight="700">✓</tspan>  Private link: only your phone</tspan>
    <tspan x="400" y="328"><tspan fill="#34d399" font-weight="700">✓</tspan>  Fixes localhost links</tspan>
    <tspan x="400" y="374"><tspan fill="#34d399" font-weight="700">✓</tspan>  Hot reload passes through</tspan>
    <tspan x="400" y="420"><tspan fill="#34d399" font-weight="700">✓</tspan>  Optional HTTPS (--https)</tspan>
    <tspan x="400" y="466"><tspan fill="#34d399" font-weight="700">✓</tspan>  Blocks spoofing and smuggling</tspan>
  </text>

  <!-- arrow to dev server -->
  <line x1="718" y1="330" x2="852" y2="330" stroke="#34d399" stroke-width="4" marker-start="url(#ok)" marker-end="url(#ok)"/>
  <text x="785" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#cbd5e1">as localhost</text>

  <!-- dev server -->
  <rect x="860" y="210" width="270" height="240" rx="20" fill="#0f172a" stroke="#475569" stroke-width="2.5"/>
  <text x="890" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Your dev server</text>
  <text x="890" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#34d399">localhost:3000</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">
    <tspan x="890" y="346">Next.js · Vite · Astro</tspan>
    <tspan x="890" y="372">Laravel · Django · Rails</tspan>
    <tspan x="890" y="398">PHP · any local port</tspan>
  </text>
  <text x="995" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">unchanged, no config</text>

  <text x="600" y="610" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Everything stays on your Wi-Fi: no cloud, no account, nothing sent to the internet.</text>
</svg>
